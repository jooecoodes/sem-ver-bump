[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "svb"
version = "0.1.0"
description = "Recommend a semantic version bump from a git commit range."
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "typer>=0.12.0,<1",
    "openai>=1.40.0,<4",
]

[project.optional-dependencies]
dev = ["pyinstaller>=6.3,<7"]
nuitka = ["nuitka>=2.4,<3"]

[project.scripts]
svb = "svb.__main__:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
svb = ["py.typed"]
